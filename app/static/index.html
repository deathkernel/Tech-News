<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>JARVIS — Tech News</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <div>
        <div class="brand-name">JARVIS</div>
        <div class="brand-sub">TECH NEWS</div>
      </div>
    </div>
    <button id="refresh" class="refresh" type="button">Refresh</button>
  </header>

  <main>
    <section class="intro">
      <div>
        <p class="kicker">TODAY IN TECHNOLOGY</p>
        <h1>News worth<br><em>posting.</em></h1>
      </div>
      <p class="intro-copy">JARVIS finds the technology updates that are actually worth sharing.</p>
    </section>

    <section class="controls" aria-label="News controls">
      <label class="search-wrap">
        <span>⌕</span>
        <input id="search" aria-label="Search news" placeholder="Search stories...">
      </label>
      <select id="category" aria-label="Filter by category">
        <option value="">All topics</option>
      </select>
      <select id="importance" aria-label="Filter by importance">
        <option value="4">Important+</option>
        <option value="6">High impact</option>
        <option value="8">Major only</option>
      </select>
    </section>

    <div class="feed-bar">
      <span class="feed-title">LATEST POSTS</span>
      <span id="status">Loading...</span>
    </div>

    <section id="feed" class="feed" aria-live="polite"></section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
